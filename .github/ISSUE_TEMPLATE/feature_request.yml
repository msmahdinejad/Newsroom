name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user need and operational trade-offs. Features must retain
        bounded work, failure isolation, stable identity, evidence lineage, and
        safe handling of private access.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: The request does not depend on publishing private access or source data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe externally observable behavior, not only implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Source inventory/import
        - Collector/platform
        - Processing/editorial
        - LLM provider/router
        - Scheduler/delivery
        - Operations/reliability
        - Security/privacy
        - Contributor experience
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Bounds, failure modes, and privacy impact
      description: Address rate limits, retries, persistence, access isolation, and fallback.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
