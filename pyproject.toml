[project]
name = "newsroom"
version = "3.0.0"
description = "Local-first, multi-source news collection and AI reporting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "msmahdinejad" }]
keywords = ["newsroom", "ai", "telegram", "news-aggregation", "llm-router"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
]
dependencies = [
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "socksio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/msmahdinejad/Newsroom"
Documentation = "https://github.com/msmahdinejad/Newsroom/tree/main/docs"
Repository = "https://github.com/msmahdinejad/Newsroom.git"
Issues = "https://github.com/msmahdinejad/Newsroom/issues"
Changelog = "https://github.com/msmahdinejad/Newsroom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pytest-httpx>=0.36.2",
]
telegram = [
    "telethon>=1.44.0",
    "pysocks>=1.7.1",
    "python-socks[asyncio]>=3.0.0",
]
external-sources = [
    "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/1494c2ab239e7355a77e7cceaf3271453a1f34b5.zip",
    "twitter-cli==0.8.5",
]

[project.scripts]
newsroom = "newsroom.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: async tests",
    "integration: real PostgreSQL tests",
]

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
]
