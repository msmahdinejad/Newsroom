services:
  postgres:
    image: postgres:16-alpine
    container_name: newsroom-postgres
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsroom_dev}
    ports:
      - "127.0.0.1:${NEWSROOM_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  migrate:
    build: .
    container_name: newsroom-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    command: uv run alembic upgrade head
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  collector:
    build: .
    container_name: newsroom-collector
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      # Native stateless collectors (RSS, GitHub, Reddit, web_page, YouTube
      # RSS) run here. Telegram MTProto is exclusively owned by the dedicated
      # telegram-ingestor service; X is owned by agent-reach-worker.
      COLLECT_LIMIT_PER_SOURCE: ${COLLECT_LIMIT_PER_SOURCE:-10}
      COLLECT_MAX_SOURCES_PER_CYCLE: ${COLLECT_MAX_SOURCES_PER_CYCLE:-20}
      COLLECT_SOURCE_SPACING_SECONDS: ${COLLECT_SOURCE_SPACING_SECONDS:-1}
      COLLECT_CONCURRENCY: ${COLLECT_CONCURRENCY:-4}
      COLLECTION_TIMEOUT_CONNECT: ${COLLECTION_TIMEOUT_CONNECT:-30}
      COLLECTION_TIMEOUT_READ: ${COLLECTION_TIMEOUT_READ:-60}
      COLLECTION_MAX_SIZE_MB: ${COLLECTION_MAX_SIZE_MB:-2}
      COLLECTION_USER_AGENT: ${COLLECTION_USER_AGENT:-newsroom/2.0}
      COLLECTION_PROXY_URL: ${COLLECTION_PROXY_URL:-}
      COLLECT_LOOP_SECONDS: ${COLLECT_LOOP_SECONDS:-900}
    command:
      - uv
      - run
      - python
      - -c
      - |
        import asyncio, time, os
        from newsroom.pipeline.collect import collect_sources
        from newsroom.storage.database import get_db
        loop_s = int(os.environ.get("COLLECT_LOOP_SECONDS", "900"))
        while True:
            with get_db() as db:
                asyncio.run(collect_sources(
                    db,
                    limit_per_source=int(os.environ.get("COLLECT_LIMIT_PER_SOURCE","10")),
                    max_sources=max(
                        1,
                        int(os.environ.get("COLLECT_MAX_SOURCES_PER_CYCLE","20")),
                    ),
                    source_spacing_seconds=max(
                        0.0,
                        float(os.environ.get("COLLECT_SOURCE_SPACING_SECONDS","1")),
                    ),
                    exclude_source_types={"telegram", "x_timeline"},
                ))
            open('/tmp/newsroom_collector_done','w').write('ok')
            time.sleep(loop_s)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status collector"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  report-worker:
    build: .
    container_name: newsroom-report-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    command:
      - uv
      - run
      - python
      - -c
      - |
        import time
        from argparse import Namespace
        from newsroom.cli.commands.process import process_command
        process_command(Namespace(process_command='all'))
        open('/tmp/newsroom_report_worker_done','w').write('ok')
        while True:
            time.sleep(3600)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status report_worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  scheduler:
    build: .
    container_name: newsroom-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      EDITORIAL_ENABLED: ${EDITORIAL_ENABLED:-false}
      LLM_PROVIDER_ENV_FILE: /run/newsroom/.env.providers.local
      EDITORIAL_TIMEOUT_SECONDS: ${EDITORIAL_TIMEOUT_SECONDS:-60}
      EDITORIAL_MAX_RETRIES: ${EDITORIAL_MAX_RETRIES:-2}
      EDITORIAL_MAX_INPUT_TOKENS: ${EDITORIAL_MAX_INPUT_TOKENS:-12000}
      EDITORIAL_MAX_OUTPUT_TOKENS: ${EDITORIAL_MAX_OUTPUT_TOKENS:-4000}
      EDITORIAL_TEMPERATURE: ${EDITORIAL_TEMPERATURE:-0.3}
      EDITORIAL_FALLBACK_ENABLED: ${EDITORIAL_FALLBACK_ENABLED:-true}
      EDITORIAL_MAX_STORIES_PER_CALL: ${EDITORIAL_MAX_STORIES_PER_CALL:-15}
      EDITORIAL_MAX_EVIDENCE_PER_STORY: ${EDITORIAL_MAX_EVIDENCE_PER_STORY:-10}
      EDITORIAL_MAX_EXCERPT_LENGTH: ${EDITORIAL_MAX_EXCERPT_LENGTH:-300}
      EDITORIAL_CONCURRENCY_LIMIT: ${EDITORIAL_CONCURRENCY_LIMIT:-1}
      EDITORIAL_SCHEDULED_RUN_BUDGET: ${EDITORIAL_SCHEDULED_RUN_BUDGET:-1}
      EDITORIAL_MANUAL_RUN_BUDGET: ${EDITORIAL_MANUAL_RUN_BUDGET:-3}
      # Gate 6: scalable editorial + six-hour schedule + collection bounds.
      EDITORIAL_MAX_STORIES_PER_SHARD: ${EDITORIAL_MAX_STORIES_PER_SHARD:-8}
      EDITORIAL_MAX_MAP_CALLS_PER_REPORT: ${EDITORIAL_MAX_MAP_CALLS_PER_REPORT:-12}
      EDITORIAL_MAX_REDUCTION_CALLS_PER_REPORT: ${EDITORIAL_MAX_REDUCTION_CALLS_PER_REPORT:-4}
      EDITORIAL_MAX_HIERARCHY_DEPTH: ${EDITORIAL_MAX_HIERARCHY_DEPTH:-3}
      EDITORIAL_MAX_CONCURRENT_MAP: ${EDITORIAL_MAX_CONCURRENT_MAP:-2}
      EDITORIAL_MAX_TOTAL_INPUT_TOKENS_PER_REPORT: ${EDITORIAL_MAX_TOTAL_INPUT_TOKENS_PER_REPORT:-100000}
      EDITORIAL_MAX_TOTAL_OUTPUT_TOKENS_PER_REPORT: ${EDITORIAL_MAX_TOTAL_OUTPUT_TOKENS_PER_REPORT:-30000}
      EDITORIAL_SHARD_INPUT_TOKEN_LIMIT: ${EDITORIAL_SHARD_INPUT_TOKEN_LIMIT:-8000}
      EDITORIAL_SHARD_OUTPUT_TOKEN_LIMIT: ${EDITORIAL_SHARD_OUTPUT_TOKEN_LIMIT:-4000}
      EDITORIAL_MAX_PENDING_JOBS: ${EDITORIAL_MAX_PENDING_JOBS:-3}
      EDITORIAL_STALE_JOB_TIMEOUT_SECONDS: ${EDITORIAL_STALE_JOB_TIMEOUT_SECONDS:-600}
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      SCHEDULE_REPORT_HOURS: ${SCHEDULE_REPORT_HOURS:-0,6,12,18}
    volumes:
      - ./.env.providers.local:/run/newsroom/.env.providers.local:ro
    command: uv run python -m newsroom.scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status scheduler"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram-bot:
    build: .
    container_name: newsroom-telegram-bot
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_AUTHORIZED_USER_IDS: ${TELEGRAM_AUTHORIZED_USER_IDS:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      LLM_PROVIDER_ENV_FILE: /run/newsroom/.env.providers.local
    volumes:
      - ./.env.providers.local:/run/newsroom/.env.providers.local:ro
    command: uv run python -m newsroom.delivery.bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram-ingestor:
    build: .
    container_name: newsroom-telegram-ingestor
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_PATH: /data/sessions/newsroom_ingestor.session
      TELEGRAM_INGESTOR_ENABLED: ${TELEGRAM_INGESTOR_ENABLED:-false}
      TELEGRAM_CONNECT_TIMEOUT_SECONDS: ${TELEGRAM_CONNECT_TIMEOUT_SECONDS:-12}
      TELEGRAM_CONNECTION_RETRIES: ${TELEGRAM_CONNECTION_RETRIES:-1}
      TELEGRAM_RETRY_DELAY_SECONDS: ${TELEGRAM_RETRY_DELAY_SECONDS:-2}
      TELEGRAM_RECONNECT_COOLDOWN_SECONDS: ${TELEGRAM_RECONNECT_COOLDOWN_SECONDS:-300}
      TELEGRAM_MAX_SOURCES_PER_CYCLE: ${TELEGRAM_MAX_SOURCES_PER_CYCLE:-20}
      TELEGRAM_SOURCE_SPACING_SECONDS: ${TELEGRAM_SOURCE_SPACING_SECONDS:-1}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-}
      TELEGRAM_CONNECTION_MODE: ${TELEGRAM_CONNECTION_MODE:-direct}
      TELEGRAM_MTPROXY_HOST: ${TELEGRAM_MTPROXY_HOST:-}
      TELEGRAM_MTPROXY_PORT: ${TELEGRAM_MTPROXY_PORT:-0}
      TELEGRAM_MTPROXY_SECRET: ${TELEGRAM_MTPROXY_SECRET:-}
    volumes:
      - telegram_sessions:/data/sessions
    command: uv run python -m newsroom.sources.telegram_ingestor_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status ingestor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Gate 5: Agent-Reach worker — isolated runtime for external internet and
  # social-platform capability calls. Non-root, no Docker socket, no access
  # to the Telegram MTProto session volume, no access to editorial API
  # credentials, bounded CPU and memory, isolated writable config directory.
  # Only the controlled runner inside newsroom.sources.agent_reach may launch
  # processes here; source content and editorial AI cannot produce commands.
  agent-reach-worker:
    build: .
    container_name: newsroom-agent-reach-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.x.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      AGENT_REACH_ENABLED: "true"
      AGENT_REACH_EXECUTABLE: agent-reach
      AGENT_REACH_CONFIG_DIR: /data/agent-reach
      AGENT_REACH_TIMEOUT_SECONDS: ${AGENT_REACH_TIMEOUT_SECONDS:-60}
      AGENT_REACH_MAX_OUTPUT_BYTES: ${AGENT_REACH_MAX_OUTPUT_BYTES:-2097152}
      AGENT_REACH_MAX_RETRIES: ${AGENT_REACH_MAX_RETRIES:-1}
      AGENT_REACH_CONCURRENCY_LIMIT: ${AGENT_REACH_CONCURRENCY_LIMIT:-2}
      AGENT_REACH_ALLOWED_CHANNELS: ${AGENT_REACH_WORKER_ALLOWED_CHANNELS:-web,rss,github,youtube,x}
      AGENT_REACH_PINNED_VERSION: 1494c2ab239e7355a77e7cceaf3271453a1f34b5
      AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS: "true"
      AGENT_REACH_HEALTH_INTERVAL_SECONDS: ${AGENT_REACH_HEALTH_INTERVAL_SECONDS:-300}
      X_WORKER_POLL_SECONDS: ${X_WORKER_POLL_SECONDS:-900}
      X_WORKER_BATCH_SIZE: ${X_WORKER_BATCH_SIZE:-12}
      X_WORKER_SPACING_SECONDS: ${X_WORKER_SPACING_SECONDS:-2}
      # Deliberately excludes Telegram, editorial, and other application
      # secrets. The worker talks to upstream platforms only through the
      # controlled runner.
    volumes:
      - agent_reach_config:/data/agent-reach
    # Bounded CPU and memory — the worker is a capability/diagnostics layer,
    # not a heavy compute service.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    command: uv run python -m newsroom.sources.agent_reach.worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status agent_reach_worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # One-time authorization — run with: docker compose run --rm telegram-authorize
  # Interactive: requires TTY for getpass login code and optional 2FA password
  telegram-authorize:
    profiles: ["authorize"]
    build: .
    container_name: newsroom-telegram-authorize
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_PATH: /data/sessions/newsroom_ingestor.session
      TELEGRAM_CONNECT_TIMEOUT_SECONDS: ${TELEGRAM_CONNECT_TIMEOUT_SECONDS:-12}
      TELEGRAM_CONNECTION_RETRIES: ${TELEGRAM_CONNECTION_RETRIES:-1}
      TELEGRAM_RETRY_DELAY_SECONDS: ${TELEGRAM_RETRY_DELAY_SECONDS:-2}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-}
      TELEGRAM_CONNECTION_MODE: ${TELEGRAM_CONNECTION_MODE:-direct}
      TELEGRAM_MTPROXY_HOST: ${TELEGRAM_MTPROXY_HOST:-}
      TELEGRAM_MTPROXY_PORT: ${TELEGRAM_MTPROXY_PORT:-0}
      TELEGRAM_MTPROXY_SECRET: ${TELEGRAM_MTPROXY_SECRET:-}
    volumes:
      - telegram_sessions:/data/sessions
    command: uv run python -m newsroom.sources.authorize_telegram
    stdin_open: true
    tty: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  telegram_sessions:
  agent_reach_config:
