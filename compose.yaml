services:
  postgres:
    image: postgres:16-alpine
    container_name: newsroom-postgres
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsroom_dev}
    ports:
      - "127.0.0.1:${NEWSROOM_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: newsroom-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    volumes:
      - ./src:/app/src
    command: sh -c "uv run python -c \"from newsroom.storage.database import engine; from newsroom.storage.models import Base; Base.metadata.create_all(engine)\" && tail -f /dev/null"
    healthcheck:
      test: ["CMD", "uv", "run", "newsroom", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    container_name: newsroom-worker
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    volumes:
      - ./src:/app/src
    command: uv run newsroom pipeline run
    restart: unless-stopped

volumes:
  postgres_data:
