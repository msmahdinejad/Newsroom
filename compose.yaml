services:
  postgres:
    image: postgres:16-alpine
    container_name: newsroom-postgres
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsroom_dev}
    ports:
      - "127.0.0.1:${NEWSROOM_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  migrate:
    build: .
    container_name: newsroom-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    command: uv run alembic upgrade head
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  collector:
    build: .
    container_name: newsroom-collector
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    command:
      - uv
      - run
      - python
      - -c
      - |
        import asyncio, time
        from argparse import Namespace
        from newsroom.cli.commands.collect import collect_command
        asyncio.run(collect_command(Namespace(source_type=None)))
        open('/tmp/newsroom_collector_done','w').write('ok')
        while True:
            time.sleep(3600)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status collector"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  report-worker:
    build: .
    container_name: newsroom-report-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
    command:
      - uv
      - run
      - python
      - -c
      - |
        import time
        from argparse import Namespace
        from newsroom.cli.commands.process import process_command
        process_command(Namespace(process_command='all'))
        open('/tmp/newsroom_report_worker_done','w').write('ok')
        while True:
            time.sleep(3600)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status report_worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  scheduler:
    build: .
    container_name: newsroom-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_AUTHORIZED_USER_IDS: ${TELEGRAM_AUTHORIZED_USER_IDS:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_INGESTOR_ENABLED: ${TELEGRAM_INGESTOR_ENABLED:-false}
      EDITORIAL_ENABLED: ${EDITORIAL_ENABLED:-false}
      EDITORIAL_PROVIDER: ${EDITORIAL_PROVIDER:-deterministic}
      EDITORIAL_MODEL: ${EDITORIAL_MODEL:-}
      EDITORIAL_API_BASE: ${EDITORIAL_API_BASE:-https://api.openai.com/v1}
      EDITORIAL_API_KEY: ${EDITORIAL_API_KEY:-}
      EDITORIAL_TIMEOUT_SECONDS: ${EDITORIAL_TIMEOUT_SECONDS:-60}
      EDITORIAL_MAX_RETRIES: ${EDITORIAL_MAX_RETRIES:-2}
      EDITORIAL_MAX_INPUT_TOKENS: ${EDITORIAL_MAX_INPUT_TOKENS:-12000}
      EDITORIAL_MAX_OUTPUT_TOKENS: ${EDITORIAL_MAX_OUTPUT_TOKENS:-4000}
      EDITORIAL_TEMPERATURE: ${EDITORIAL_TEMPERATURE:-0.3}
      EDITORIAL_FALLBACK_ENABLED: ${EDITORIAL_FALLBACK_ENABLED:-true}
      EDITORIAL_MAX_STORIES_PER_CALL: ${EDITORIAL_MAX_STORIES_PER_CALL:-15}
      EDITORIAL_MAX_EVIDENCE_PER_STORY: ${EDITORIAL_MAX_EVIDENCE_PER_STORY:-10}
      EDITORIAL_MAX_EXCERPT_LENGTH: ${EDITORIAL_MAX_EXCERPT_LENGTH:-300}
      EDITORIAL_CONCURRENCY_LIMIT: ${EDITORIAL_CONCURRENCY_LIMIT:-1}
      EDITORIAL_SCHEDULED_RUN_BUDGET: ${EDITORIAL_SCHEDULED_RUN_BUDGET:-1}
      EDITORIAL_MANUAL_RUN_BUDGET: ${EDITORIAL_MANUAL_RUN_BUDGET:-3}
    command: uv run python -m newsroom.scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status scheduler"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram-bot:
    build: .
    container_name: newsroom-telegram-bot
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_AUTHORIZED_USER_IDS: ${TELEGRAM_AUTHORIZED_USER_IDS:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
    command: uv run python -m newsroom.delivery.bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram-ingestor:
    build: .
    container_name: newsroom-telegram-ingestor
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_PATH: /data/sessions/newsroom_ingestor.session
      TELEGRAM_INGESTOR_ENABLED: ${TELEGRAM_INGESTOR_ENABLED:-false}
    volumes:
      - telegram_sessions:/data/sessions
    command: uv run python -m newsroom.sources.telegram_ingestor_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status ingestor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Gate 5: Agent-Reach worker — isolated runtime for external internet and
  # social-platform capability calls. Non-root, no Docker socket, no access
  # to the Telegram MTProto session volume, no access to editorial API
  # credentials, bounded CPU and memory, isolated writable config directory.
  # Only the controlled runner inside newsroom.sources.agent_reach may launch
  # processes here; source content and editorial AI cannot produce commands.
  agent-reach-worker:
    build: .
    container_name: newsroom-agent-reach-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      AGENT_REACH_ENABLED: ${AGENT_REACH_ENABLED:-false}
      AGENT_REACH_EXECUTABLE: ${AGENT_REACH_EXECUTABLE:-agent-reach}
      AGENT_REACH_CONFIG_DIR: /data/agent-reach
      AGENT_REACH_TIMEOUT_SECONDS: ${AGENT_REACH_TIMEOUT_SECONDS:-60}
      AGENT_REACH_MAX_OUTPUT_BYTES: ${AGENT_REACH_MAX_OUTPUT_BYTES:-2097152}
      AGENT_REACH_MAX_RETRIES: ${AGENT_REACH_MAX_RETRIES:-1}
      AGENT_REACH_CONCURRENCY_LIMIT: ${AGENT_REACH_CONCURRENCY_LIMIT:-2}
      AGENT_REACH_ALLOWED_CHANNELS: ${AGENT_REACH_ALLOWED_CHANNELS:-web,rss,github,youtube}
      AGENT_REACH_PINNED_VERSION: ${AGENT_REACH_PINNED_VERSION:-}
      AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS: ${AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS:-false}
      AGENT_REACH_HEALTH_INTERVAL_SECONDS: ${AGENT_REACH_HEALTH_INTERVAL_SECONDS:-300}
      # Deliberately NOT passing TELEGRAM_BOT_TOKEN, TELEGRAM_API_HASH,
      # EDITORIAL_API_KEY, or any other application secret. The worker talks
      # to upstream platforms via the controlled runner only.
    volumes:
      - agent_reach_config:/data/agent-reach
    # Bounded CPU and memory — the worker is a capability/diagnostics layer,
    # not a heavy compute service.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    command: uv run python -m newsroom.service_status agent_reach_worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m newsroom.service_status agent_reach_worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # One-time authorization — run with: docker compose run --rm telegram-authorize
  # Interactive: requires TTY for getpass login code and optional 2FA password
  telegram-authorize:
    build: .
    container_name: newsroom-telegram-authorize
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${POSTGRES_PASSWORD:-newsroom_dev}@postgres:5432/newsroom
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_PATH: /data/sessions/newsroom_ingestor.session
    volumes:
      - telegram_sessions:/data/sessions
    command: uv run python -m newsroom.sources.authorize_telegram
    stdin_open: true
    tty: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  telegram_sessions:
  agent_reach_config:
