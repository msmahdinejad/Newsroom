# Persian AI Newsroom — illustrative source configuration (no credentials).
#
# The private workbook is the authoritative production inventory. This file is
# an optional local experiment; production services do not load it.
#
# Rules:
# - NEVER put cookies, tokens, API keys, browser-profile paths, or
#   authorization headers in this file or in the database.
# - Authenticated channels (X, Reddit) require explicit owner opt-in via
#   AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS=true and dedicated operational
#   accounts configured locally in the isolated agent_reach_config volume.
# - Add only sources you have the right to monitor. Keep production source
#   lists in the private workbook, not this public example.

# ── Telegram (native MTProto ingestion) ────────────────────────────
telegram:
  enabled: true
  # Telegram collection uses the existing MTProto ingestor service.
  # Channels are curated via the Telegram API (chat IDs are stored hashed
  # in the database, never in this file).
  # See: docs/verification/GATE_3_*.md
  channels: []  # intentionally empty public example

# ── RSS (native feedparser collector) ──────────────────────────────
rss:
  enabled: true
  # The existing native RSS collector (src/newsroom/sources/rss.py) is
  # retained for scheduled production collection. Agent-Reach's feedparser
  # capability is used for diagnostics only.
  feeds:
    - name: "Hacker News (frontpage)"
      url: "https://hnrss.org/frontpage"
      poll_interval_minutes: 30
    # Add local experimental feeds here only when needed.

# ── Websites (bounded reader) ──────────────────────────────────────
websites:
  enabled: true
  # Allowlisted public domains only. SSRF protection enforced.
  # See: DEFAULT_WEB_ALLOWED_DOMAINS in src/newsroom/sources/agent_reach/adapters.py
  sources:
    - name: "OpenAI blog"
      url: "https://openai.com/blog/"
      allowed_domains: ["openai.com"]
      poll_interval_minutes: 60
    - name: "Anthropic news"
      url: "https://anthropic.com/news"
      allowed_domains: ["anthropic.com"]
      poll_interval_minutes: 60
    - name: "arXiv (cs.AI)"
      url: "https://arxiv.org/list/cs.AI/recent"
      allowed_domains: ["arxiv.org", "www.arxiv.org"]
      poll_interval_minutes: 120
    - name: "Google DeepMind"
      url: "https://deepmind.google/discover/blog/"
      allowed_domains: ["deepmind.google"]
      poll_interval_minutes: 60
    - name: "Microsoft Research blog"
      url: "https://www.microsoft.com/en-us/research/blog/"
      allowed_domains: ["microsoft.com", "blogs.microsoft.com"]
      poll_interval_minutes: 60
    - name: "Meta AI blog"
      url: "https://ai.meta.com/blog/"
      allowed_domains: ["ai.meta.com"]
      poll_interval_minutes: 60
    # Add local experimental sites here only when needed.

# ── GitHub (native release collector) ───────────────────────────────
github:
  enabled: true
  # The existing native GitHub release collector (src/newsroom/sources/github.py)
  # is retained for scheduled production collection. Agent-Reach's gh CLI
  # adapter is used for curated repo discovery only.
  repositories:
    - name: "PyTorch"
      owner: "pytorch"
      repo: "pytorch"
      poll_interval_minutes: 120
    - name: "TensorFlow"
      owner: "tensorflow"
      repo: "tensorflow"
      poll_interval_minutes: 120
    - name: "Hugging Face Transformers"
      owner: "huggingface"
      repo: "transformers"
      poll_interval_minutes: 120
    - name: "Agent-Reach"
      owner: "Panniantong"
      repo: "Agent-Reach"
      poll_interval_minutes: 240
    # Add local experimental repositories here only when needed.

  # Optional: Agent-Reach discovery queries (gh search repos)
  discovery:
    enabled: true
    queries:
      - "AI agents language:python stars:>1000"
      - "Persian NLP language:python"
    limit_per_query: 10
    poll_interval_minutes: 1440  # daily

# ── YouTube (native RSS or bounded capability adapter) ──────────────
youtube:
  enabled: true
  # Curated public channel allowlist only. Metadata-only collection.
  # No media download, no comments, no private videos, no arbitrary URLs.
  channels:
    - name: "Yannic Kilcher"
      channel_handle: "YannicKilcher"
      # channel_id may be supplied locally for a stable source identity.
      max_items_per_poll: 25
      poll_interval_minutes: 120
    - name: "Two Minute Papers"
      channel_handle: "TwoMinutePapers"
      max_items_per_poll: 25
      poll_interval_minutes: 120
    - name: "AI Coffee Break"
      channel_handle: "AICoffeeBreak"
      max_items_per_poll: 25
      poll_interval_minutes: 120
    # Add local experimental channels here only when needed.

  # Subtitle text (optional, bounded)
  subtitles:
    enabled: false  # opt-in
    languages: ["en.", "fa."]
    max_chars: 8000
    timeout_seconds: 30

# ── X / Twitter (optional authenticated production collector) ───────
x:
  enabled: false  # Enable only after local authenticated-route validation.
  # Production integration requires:
  # - AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS=true (owner opt-in)
  # - dedicated non-primary X account
  # - cookies configured locally in the isolated agent_reach_config volume
  # - explicit curated account list
  # - durable cursors implemented
  # - bounded real-read test of monitoring succeeds
  accounts: []  # intentionally empty public example
  # Public-page reading (manual discovery, no auth) is always available
  # via the XPublicReadCollector for one-off research URLs.

# ── Reddit (optional public or authenticated collector) ─────────────
reddit:
  enabled: false  # Enable only after local route validation.
  # Production integration requires:
  # - AGENT_REACH_ALLOW_AUTHENTICATED_CHANNELS=true (owner opt-in)
  # - dedicated Reddit account
  # - rdt-cli login configured locally
  # - explicit curated subreddit list
  # - bounded comment depth and result count
  # - bounded real-read test of subreddit monitoring succeeds
  subreddits: []  # intentionally empty public example
  # Public-page reading (manual research, no login) is always available
  # via the RedditPublicReadCollector for one-off research URLs.

# ── Deferred channels ──────────────────────────────────────────────
# The following channels are not production collectors in this release:
#   linkedin, instagram, facebook, tiktok, bilibili, xiaohongshu, v2ex,
#   xiaoyuzhou (podcast), xueqiu, search (Exa)
# Add one only after a documented use case and owner approval.
